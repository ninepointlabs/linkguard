# Linkguard for a folderblog site. Copy to .github/workflows/linkguard.yml
name: Linkguard

on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC
  workflow_dispatch:

# open-pr needs write access to create a branch and a pull request.
permissions:
  contents: write
  pull-requests: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ninepointlabs/linkguard@v0.1.1
        with:
          site-type: folderblog
          # Propose archived replacements for dead links in a pull request (never pushes to the default branch).
          open-pr: true
          # Optional: create new snapshots with your own free Internet Archive keys.
          # Without these, Linkguard runs in lookup-only mode.
          wayback-access-key: ${{ secrets.WAYBACK_ACCESS_KEY }}
          wayback-secret-key: ${{ secrets.WAYBACK_SECRET_KEY }}
